services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: magazakit
      POSTGRES_PASSWORD: magazakit
      POSTGRES_DB: magazakit
    ports:
      - '5433:5432'
    volumes:
      - magazakit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magazakit -d magazakit']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  magazakit_pg:
